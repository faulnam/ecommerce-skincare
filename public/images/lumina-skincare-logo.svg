<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
    <style>
        .brand-text {
            font-family: -apple-system, BlinkMacSystemFont, "Playfair Display", "Didot", "Cinzel", "Georgia", serif;
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 0.28em;
            fill: #18181B;
        }
        .tagline-text {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", sans-serif;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.45em;
            fill: #71717A;
            text-transform: uppercase;
        }
        .dot {
            fill: #2D4C41;
        }
    </style>
    <text x="50%" y="58" text-anchor="middle" class="brand-text">LUMINA</text>
    <circle cx="395" cy="40" r="4" class="dot"/>
    <text x="50%" y="95" text-anchor="middle" class="tagline-text">SKINCARE</text>
</svg>